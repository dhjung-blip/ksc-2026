<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행자 · KSC 2026 Q&A</title>
<link rel="stylesheet" href="style.css?v=12">
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t&&/^[a-z]+$/.test(t)){document.querySelector("link[rel=stylesheet]").href="style-"+t+".css?v=1";}})();</script>
</head>
<body class="admin">
<div class="wrap">
  <header class="page">
    <div class="event-title" id="eventTitle"></div>
    <span class="muted small">진행자 페이지</span>
  </header>

  <div id="gate" class="card" style="display:none">
    <h2>진행자 확인</h2>
    <label>관리자 암호</label>
    <input id="pass" type="password" placeholder="암호 입력">
    <button id="loginBtn" class="btn btn-primary btn-block">입장</button>
    <p id="gateMsg" class="muted small"></p>
  </div>

  <div id="main" style="display:none">
    <div class="card">
      <h2>새 라운드 시작</h2>
      <div class="row">
        <select id="titleSel"></select>
        <button id="createBtn" class="btn btn-primary">시작</button>
      </div>
      <div class="row" id="customRow" style="display:none;margin-top:8px">
        <input id="newTitle" placeholder="세션 제목 직접 입력">
      </div>
      <p class="muted small">세션을 골라 시작하세요. 새 라운드를 시작하면 진행 중이던 라운드는 자동으로 마감되며, QR/주소는 그대로 유지됩니다.</p>
    </div>
    <div id="dyn"></div>
  </div>
</div>
<script src="config.js?v=5"></script>
<script src="app.js?v=2"></script>
<script>
mountDemoBadge();
document.getElementById('eventTitle').textContent = CFG.EVENT_TITLE || 'KSC 2026 Q&A';

const passKey = 'qws-pass';
let state = null, dynKey = '', polling = false;

function getPass() { return IS_DEMO ? 'demo' : (sessionStorage.getItem(passKey) || ''); }

function dynHtml() {
  const r = state.round;
  if (!r) return '<div class="card center muted">아직 라운드가 없습니다.<br>위에서 첫 라운드를 시작하세요.</div>';
  const qs = state.questions || [];
  const sel = qs.filter(function (q) { return q.selected; });
  let h = '<div class="card">'
    + '<div class="round-head compact"><span class="round-no">라운드 ' + r.round_no + '</span>'
    + '<span class="pill ' + (r.status === 'open' ? 'open' : 'closed') + '">' + (r.status === 'open' ? '질문 접수 중' : '접수 마감') + '</span>'
    + '<h2 style="margin-top:6px">' + esc(r.title) + '</h2></div>'
    + '<div class="row">'
    + (r.status === 'open'
      ? '<button class="btn" data-act="close" data-id="' + r.id + '">질문 접수 마감</button>'
      : '<button class="btn" data-act="reopen" data-id="' + r.id + '">접수 다시 열기</button>')
    + '</div></div>';

  h += '<div class="list-head">질문 <b>' + qs.length + '</b>개 · 선정 <b>' + sel.length + '</b>/2</div>';
  if (!qs.length) h += '<div class="card center muted">아직 등록된 질문이 없습니다.</div>';

  h += qs.slice().reverse().map(function (q) {
    const blocked = sel.length >= 2 && !q.selected;
    return '<div class="qcard' + (q.selected ? ' win' : '') + '">'
      + (q.selected ? '<div class="win-tag">🏆 선정됨</div>' : '')
      + '<div class="q-content">' + esc(q.content) + '</div>'
      + '<div class="q-meta">' + esc(q.author || '익명') + '</div>'
      + '<div class="q-actions">'
      + '<button class="btn small ' + (q.selected ? '' : 'btn-primary') + '" data-act="sel" data-id="' + q.id + '" data-val="' + (q.selected ? '0' : '1') + '"' + (blocked ? ' disabled' : '') + '>'
      + (q.selected ? '선정 해제' : '⭐ 선정') + '</button>'
      + '<button class="btn small btn-danger" data-act="del" data-id="' + q.id + '">삭제</button>'
      + '</div></div>';
  }).join('');

  const w = (state.winners || []).filter(function (x) { return x.round_id !== r.id; });
  if (w.length) {
    h += '<h2 class="section-title">지난 선정 기록</h2>' + w.map(function (x) {
      return '<div class="qcard slim"><div class="q-meta">라운드 ' + x.round_no + ' · ' + esc(x.round_title) + '</div>'
        + '<div class="q-content">' + esc(x.content) + '</div>'
        + '<div class="q-meta">' + esc(x.author || '익명') + '</div></div>';
    }).join('');
  }
  return h;
}

async function refresh() {
  state = await store.getState();
  const k = JSON.stringify(state);
  if (k !== dynKey) { dynKey = k; document.getElementById('dyn').innerHTML = dynHtml(); }
}

function handleErr(err) {
  const m = String(err && err.message || err);
  if (m.indexOf('PASSCODE') >= 0) { sessionStorage.removeItem(passKey); location.reload(); return; }
  if (m.indexOf('MAX_SELECTED') >= 0) { toast('이미 2개를 선정했습니다. 하나를 해제한 뒤 선정하세요.', true); return; }
  toast(m, true);
}

async function dynClick(e) {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = Number(b.dataset.id), act = b.dataset.act, pass = getPass();
  try {
    if (act === 'close') await store.closeRound(pass, id);
    else if (act === 'reopen') await store.reopenRound(pass, id);
    else if (act === 'sel') await store.setSelected(pass, id, b.dataset.val === '1');
    else if (act === 'del') { if (!confirm('이 질문을 삭제할까요?')) return; await store.deleteQuestion(pass, id); }
    await refresh();
  } catch (err) { handleErr(err); }
}

const TITLES = (CFG.SESSION_TITLES || []).slice();

function selectedTitle() {
  const sel = document.getElementById('titleSel');
  if (sel.value === '__custom__') return document.getElementById('newTitle').value.trim();
  return TITLES[Number(sel.value)] || '';
}

function init() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('main').style.display = 'block';

  const sel = document.getElementById('titleSel');
  sel.innerHTML = TITLES.map(function (t, i) {
    return '<option value="' + i + '">' + (i + 1) + '. ' + esc(t) + '</option>';
  }).join('') + '<option value="__custom__">직접 입력…</option>';
  sel.addEventListener('change', function () {
    document.getElementById('customRow').style.display = sel.value === '__custom__' ? 'flex' : 'none';
  });
  if (!TITLES.length) {
    sel.value = '__custom__';
    document.getElementById('customRow').style.display = 'flex';
  } else {
    store.getState().then(function (s) {
      const idx = s && s.round ? s.round.round_no : 0;
      if (TITLES[idx] !== undefined) sel.value = String(idx);
    }).catch(function () {});
  }

  document.getElementById('createBtn').addEventListener('click', async function () {
    const btn = document.getElementById('createBtn');
    btn.disabled = true;
    try {
      await store.createRound(getPass(), selectedTitle());
      toast('새 라운드를 시작했습니다 ✅');
      if (sel.value !== '__custom__') {
        const nx = Number(sel.value) + 1;
        if (TITLES[nx] !== undefined) sel.value = String(nx);
      } else {
        document.getElementById('newTitle').value = '';
      }
      await refresh();
    } catch (e) { handleErr(e); }
    btn.disabled = false;
  });
  document.getElementById('dyn').addEventListener('click', dynClick);
  if (!polling) { polling = true; startPolling(refresh); }
}

function showGate() {
  document.getElementById('gate').style.display = 'block';
  const go = async function () {
    const p = document.getElementById('pass').value;
    if (!p) return;
    const msg = document.getElementById('gateMsg');
    msg.textContent = '확인 중…';
    try {
      await store.adminLogin(p);
      sessionStorage.setItem(passKey, p);
      msg.textContent = '';
      init();
    } catch (e) { msg.textContent = '암호가 올바르지 않습니다.'; }
  };
  document.getElementById('loginBtn').addEventListener('click', go);
  document.getElementById('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
}

if (IS_DEMO) init();
else if (sessionStorage.getItem(passKey)) {
  store.adminLogin(getPass()).then(init).catch(function () { sessionStorage.removeItem(passKey); showGate(); });
} else showGate();
</script>
</body>
</html>
