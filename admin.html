<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행자 · KSC 2026 Q&A</title>
<link rel="stylesheet" href="style.css?v=16">
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t&&/^[a-z]+$/.test(t)){document.querySelector("link[rel=stylesheet]").href="style-"+t+".css?v=1";}})();</script>
</head>
<body class="admin">
<div class="wrap">
  <header class="page">
    <div class="event-title" id="eventTitle"></div>
    <span class="muted small">진행자 페이지</span>
  </header>

  <div id="gate" class="card" style="display:none">
    <h2>진행자 확인</h2>
    <label>관리자 암호</label>
    <input id="pass" type="password" placeholder="암호 입력">
    <button id="loginBtn" class="btn btn-primary btn-block">입장</button>
    <p id="gateMsg" class="muted small"></p>
  </div>

  <div id="main" style="display:none">
    <div id="dyn"></div>
    <div class="center" style="margin-top:26px">
      <button id="resetBtn" class="btn small btn-danger">전체 초기화</button>
    </div>
  </div>
</div>
<script src="config.js?v=6"></script>
<script src="app.js?v=9"></script>
<script>
mountDemoBadge();
document.getElementById('eventTitle').textContent = CFG.EVENT_TITLE || 'KSC 2026 Q&A';

const passKey = 'qws-pass';
let state = null, dynKey = '', polling = false;

function getPass() { return IS_DEMO ? 'demo' : (sessionStorage.getItem(passKey) || ''); }
function sessions() { return (state && state.sessions) || []; }

function dynHtml() {
  if (!sessions().length) return '<div class="card center muted">프로그램이 없습니다. Supabase에서 migrate-v3.sql을 실행했는지 확인하세요.</div>';
  return sessions().map(function (s, i) {
    const qs = (s.questions || []).slice().reverse();
    const sel = (s.questions || []).filter(function (q) { return q.selected; });
    let x = '<div class="card">'
      + '<div class="sess-row"><div>'
      + '<span class="round-no">PROGRAM ' + (i + 1) + '</span>'
      + '<h2 style="margin:6px 0 4px">' + esc(splitTitle(s.title).title) + '</h2>'
      + '<p class="q-meta" style="margin:0">' + (splitTitle(s.title).speaker ? esc(splitTitle(s.title).speaker) + ' · ' : '') + '질문 ' + (s.questions || []).length + '개 · 선정 ' + sel.length + '/2 · 스크린: ?s=' + (i + 1) + '</p>'
      + '</div>'
      + '<button class="btn small" data-act="' + (s.status === 'open' ? 'close' : 'reopen') + '" data-id="' + s.id + '">'
      + (s.status === 'open' ? '접수 마감' : '접수 열기') + '</button></div>';
    if (qs.length) {
      x += qs.map(function (q) {
        const blocked = sel.length >= 2 && !q.selected;
        return '<div class="qcard' + (q.selected ? ' win' : '') + '">'
          + (q.selected ? '<div class="win-tag">🏆 선정됨</div>' : '')
          + '<div class="q-content">' + esc(q.content) + '</div>'
          + '<div class="q-meta">' + esc(q.author || '익명') + (q.phone4 ? ' · ' + esc(q.phone4) : '') + '</div>'
          + '<div class="q-actions">'
          + '<button class="btn small' + (q.selected ? '' : ' btn-primary') + '" data-act="sel" data-id="' + q.id + '" data-val="' + (q.selected ? '0' : '1') + '"' + (blocked ? ' disabled' : '') + '>'
          + (q.selected ? '선정 해제' : '⭐ 선정') + '</button>'
          + '<button class="btn small btn-danger" data-act="del" data-id="' + q.id + '">삭제</button>'
          + '</div></div>';
      }).join('');
    } else {
      x += '<p class="muted small" style="margin:10px 0 0">아직 질문이 없습니다.</p>';
    }
    return x + '</div>';
  }).join('');
}

async function refresh() {
  state = await store.getStateAdmin(getPass());
  const k = JSON.stringify(state);
  if (k !== dynKey) { dynKey = k; document.getElementById('dyn').innerHTML = dynHtml(); }
}

function handleErr(err) {
  const m = String(err && err.message || err);
  if (m.indexOf('PASSCODE') >= 0) { sessionStorage.removeItem(passKey); location.reload(); return; }
  if (m.indexOf('MAX_SELECTED') >= 0) { toast('이 세션은 이미 2개를 선정했습니다. 하나를 해제한 뒤 선정하세요.', true); return; }
  toast(m, true);
}

async function dynClick(e) {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = Number(b.dataset.id), act = b.dataset.act, pass = getPass();
  try {
    if (act === 'close') await store.closeRound(pass, id);
    else if (act === 'reopen') await store.reopenRound(pass, id);
    else if (act === 'sel') await store.setSelected(pass, id, b.dataset.val === '1');
    else if (act === 'del') { if (!confirm('이 질문을 삭제할까요?')) return; await store.deleteQuestion(pass, id); }
    await refresh();
  } catch (err) { handleErr(err); }
}

function init() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  document.getElementById('dyn').addEventListener('click', dynClick);
  document.getElementById('resetBtn').addEventListener('click', async function () {
    if (!confirm('모든 질문이 삭제되고 전체 프로그램이 접수 중 상태로 돌아갑니다.\n초기화할까요?')) return;
    try { await store.resetAll(getPass()); toast('초기화되었습니다'); await refresh(); }
    catch (e) { handleErr(e); }
  });
  if (!polling) { polling = true; startPolling(refresh); }
}

function showGate() {
  document.getElementById('gate').style.display = 'block';
  const go = async function () {
    const p = document.getElementById('pass').value;
    if (!p) return;
    const msg = document.getElementById('gateMsg');
    msg.textContent = '확인 중…';
    try {
      await store.adminLogin(p);
      sessionStorage.setItem(passKey, p);
      msg.textContent = '';
      init();
    } catch (e) { msg.textContent = '암호가 올바르지 않습니다.'; }
  };
  document.getElementById('loginBtn').addEventListener('click', go);
  document.getElementById('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
}

if (IS_DEMO) init();
else if (sessionStorage.getItem(passKey)) {
  store.adminLogin(getPass()).then(init).catch(function () { sessionStorage.removeItem(passKey); showGate(); });
} else showGate();
</script>
</body>
</html>
