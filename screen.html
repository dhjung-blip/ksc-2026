<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크린 · KSC 2026 Q&A</title>
<link rel="stylesheet" href="style.css?v=16">
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t&&/^[a-z]+$/.test(t)){document.querySelector("link[rel=stylesheet]").href="style-"+t+".css?v=1";}})();</script>
</head>
<body class="screen">
<div class="s-wrap">
  <header class="s-head">
    <div>
      <div class="s-event" id="eventTitle"></div>
      <div class="s-round" id="sRound">불러오는 중…</div>
      <div class="s-speaker" id="sSpeaker"></div>
    </div>
    <div class="s-qr">
      <div id="qrbox"></div>
      <div class="s-url" id="urlText"></div>
    </div>
  </header>
  <main id="stage"></main>
</div>
<script src="config.js?v=6"></script>
<script src="app.js?v=7"></script>
<script>
mountDemoBadge();
document.getElementById('eventTitle').textContent = CFG.EVENT_TITLE || 'KSC 2026 Q&A';

// 스킨 (?skin=) — 구조는 동일, 색만 교체
const SKINS = {
  bp:       { qr: '#131F38' },
  midnight: { qr: '#101A2E', vars: {'--cream':'#111A2C','--cream-deep':'#0C1424','--panel':'rgba(255,255,255,.07)','--ink':'#E9E6DC','--ink-deep':'#F4F1E8','--muted':'#97A0B5','--bronze':'#C9AE7C','--bronze-soft':'#A98F63','--line':'rgba(233,230,220,.18)','--line-strong':'rgba(233,230,220,.45)','--wash1':'rgba(255,255,255,.05)','--wash2':'rgba(201,174,124,.10)','--wash3':'rgba(120,140,190,.10)'} },
  ivory:    { qr: '#1B2540', vars: {'--cream':'#F4F2EA','--cream-deep':'#ECE8DC','--panel':'rgba(255,255,255,.68)','--ink':'#26324E','--ink-deep':'#1B2540','--muted':'#83857B','--bronze':'#2F4A86','--bronze-soft':'#6C82B5','--line':'rgba(30,42,72,.18)','--line-strong':'rgba(30,42,72,.42)','--wash1':'rgba(255,255,255,.9)','--wash2':'rgba(212,202,172,.35)','--wash3':'rgba(212,202,172,.25)'} },
  prussian: { qr: '#14315E', vars: {'--cream':'#1C3C71','--cream-deep':'#152F5B','--panel':'rgba(255,255,255,.08)','--ink':'#EDF2FA','--ink-deep':'#FFFFFF','--muted':'#9FB4D6','--bronze':'#D9C289','--bronze-soft':'#B7A26E','--line':'rgba(237,242,250,.2)','--line-strong':'rgba(237,242,250,.5)','--wash1':'rgba(255,255,255,.10)','--wash2':'rgba(120,150,200,.18)','--wash3':'rgba(120,150,200,.14)'} },
};
const skinKey = new URLSearchParams(location.search).get('skin') || 'bp';
const SKIN = SKINS[skinKey] || SKINS.bp;
if (SKIN.vars) Object.keys(SKIN.vars).forEach(function (k) { document.documentElement.style.setProperty(k, SKIN.vars[k]); });

const baseUrl = location.origin + location.pathname.replace(/screen\.html$/, '');
document.getElementById('urlText').textContent = baseUrl.replace(/^https?:\/\//, '');

// QR 라이브러리(CDN) — 로드 실패 시 주소 텍스트만 표시
(function () {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js';
  s.onload = function () {
    new QRCode(document.getElementById('qrbox'), {
      text: baseUrl, width: 172, height: 172,
      colorDark: SKIN.qr || '#14418F', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  };
  s.onerror = function () { document.getElementById('qrbox').style.display = 'none'; };
  document.head.appendChild(s);
})();

let state = null, key = '';
const prevIds = new Set();
const sParam = Number(new URLSearchParams(location.search).get('s')) || 0;

function sessions() { return (state && state.sessions) || []; }
function pad3(n) { return String(n).padStart(3, '0'); }
function qno(i) { return 'Q.' + pad3(i + 1); }
function urlFor(sNum) {
  const p = new URLSearchParams(location.search);
  if (sNum) p.set('s', sNum); else p.delete('s');
  p.delete('r');
  const q = p.toString();
  return location.pathname + (q ? '?' + q : '');
}
function navHtml() {
  return '<div class="s-nav"><a href="' + urlFor(0) + '">‹ 전체 프로그램</a></div>';
}

function singleHtml(s) {
  const nav = navHtml();
  const qs = s.questions || [];
  if (s.status === 'open') {
    if (!qs.length) {
      return nav + '<div class="s-center"><div class="s-big">첫 질문을 등록해 주세요</div><div class="s-sub">SCAN TO ASK — QR 스캔 후 프로그램 선택</div></div>';
    }
    const shown = qs.slice(-8);
    const offset = qs.length - shown.length;
    return nav + '<div class="s-count">REGISTERED <b>' + pad3(qs.length) + '</b>'
      + (offset ? ' · 최근 8개 표시' : '') + '</div>'
      + '<ol class="t-list">'
      + shown.map(function (q, i) {
        const idx = offset + i;
        return '<li class="t-item' + (prevIds.has(q.id) ? '' : ' fresh') + (q.selected ? ' sel' : '') + '">'
          + '<span class="t-no">' + qno(idx) + '</span>'
          + '<p class="t-q">' + esc(q.content) + '</p>'
          + '<span class="t-by">' + esc(q.author || '익명') + '</span>'
          + '</li>';
      }).join('')
      + '</ol>';
  }
  const winners = qs.filter(function (q) { return q.selected; });
  if (!winners.length) {
    return nav + '<div class="s-center"><div class="s-big">우수 질문 선정 중</div><div class="s-sub">REVIEW IN PROGRESS<span class="dots"></span></div></div>';
  }
  const figs = ['FIG.A', 'FIG.B'];
  return nav + '<div class="t-winhead">— SELECTED QUESTIONS —</div>'
    + '<div class="t-figs">'
    + winners.map(function (q, i) {
      return '<figure class="t-fig"><figcaption>' + (figs[i] || 'FIG.' + (i + 1)) + '</figcaption>'
        + '<p>' + esc(q.content) + '</p>'
        + '<cite>— ' + esc(q.author || '익명') + '</cite>'
        + '<span class="t-stamp">SELECTED ✓</span></figure>';
    }).join('')
    + '</div>';
}

function overviewHtml() {
  return '<div class="s-count">ALL PROGRAMS <b>' + pad3(sessions().length) + '</b></div>'
    + '<ol class="t-list">'
    + sessions().map(function (s, i) {
      const qs = s.questions || [];
      const sel = qs.filter(function (q) { return q.selected; }).length;
      const p = splitTitle(s.title);
      return '<li class="t-item' + (sel ? ' sel' : '') + '" data-s="' + (i + 1) + '">'
        + '<span class="t-no">P.' + String(i + 1).padStart(2, '0') + (s.status === 'open' ? '' : ' · CLOSED') + '</span>'
        + '<p class="t-q">' + esc(p.title) + '</p>'
        + (p.speaker ? '<span class="t-sp">' + esc(p.speaker) + '</span>' : '')
        + '<span class="t-by">질문 ' + qs.length + '개' + (sel ? ' · ★ 우수 질문 발표' : '') + '</span>'
        + '</li>';
    }).join('')
    + '</ol>';
}

function stageHtml() {
  if (!sessions().length) {
    return '<div class="s-center">'
      + '<div class="s-big">QR을 스캔해 접속하세요</div>'
      + '<div class="s-sub">SCAN TO ASK — 준비 중</div></div>';
  }
  const s = sParam >= 1 ? sessions()[sParam - 1] : null;
  return s ? singleHtml(s) : overviewHtml();
}

function render() {
  const s = sParam >= 1 ? sessions()[sParam - 1] : null;
  const ev = CFG.EVENT_TITLE || 'KSC 2026 Q&A';
  const p = s ? splitTitle(s.title) : null;
  document.getElementById('sRound').textContent =
    p ? p.title : (sessions().length ? ev : '곧 시작합니다');
  document.getElementById('sSpeaker').textContent = p && p.speaker ? p.speaker : '';
  document.getElementById('eventTitle').textContent = s ? ev : '';
  const k = sParam + '|' + JSON.stringify(state);
  if (k === key) return;
  key = k;
  document.getElementById('stage').innerHTML = stageHtml();
  sessions().forEach(function (ss) { (ss.questions || []).forEach(function (q) { prevIds.add(q.id); }); });
}

document.getElementById('stage').addEventListener('click', function (e) {
  const item = e.target.closest('.t-item[data-s]');
  if (item) location.href = urlFor(Number(item.dataset.s));
});

startPolling(async function () { state = await store.getState(); render(); }, 2000);
</script>
</body>
</html>
