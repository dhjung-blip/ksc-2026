<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질문 등록 · KSC 2026 Q&A</title>
<link rel="stylesheet" href="style.css?v=22">
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t&&/^[a-z]+$/.test(t)){document.querySelector("link[rel=stylesheet]").href="style-"+t+".css?v=1";}})();</script>
</head>
<body>
<div class="wrap">
  <header class="page"><div class="event-title" id="eventTitle"></div></header>
  <div id="app"><div class="card center muted">불러오는 중…</div></div>
</div>
<script src="config.js?v=7"></script>
<script src="app.js?v=8"></script>
<script>
mountDemoBadge();
document.getElementById('eventTitle').textContent = CFG.EVENT_TITLE || 'KSC 2026 Q&A';

const app = document.getElementById('app');
const nameKey = 'qws-name', phoneKey = 'qws-phone', mineKey = 'qws-mine', selKey = 'qws-session';
let state = null, viewKey = '';

function myIds(rid) {
  try { return (JSON.parse(localStorage.getItem(mineKey)) || {})[rid] || []; } catch (e) { return []; }
}
function addMine(rid, qid) {
  let m = {};
  try { m = JSON.parse(localStorage.getItem(mineKey)) || {}; } catch (e) {}
  (m[rid] = m[rid] || []).push(qid);
  localStorage.setItem(mineKey, JSON.stringify(m));
}
function sessions() { return (state && state.sessions) || []; }
function currentSession() {
  const id = Number(localStorage.getItem(selKey));
  return sessions().find(function (s) { return s.id === id; }) || null;
}

function qCard(q, rid) {
  const mine = myIds(rid).indexOf(q.id) >= 0;
  return '<div class="qcard' + (q.selected ? ' win' : '') + (mine ? ' mine' : '') + '">'
    + (q.selected ? '<div class="win-tag">🏆 우수 질문</div>' : '')
    + '<div class="q-content">' + esc(q.content) + '</div>'
    + '<div class="q-meta">' + esc(q.author || '익명') + (mine ? ' · 내 질문' : '') + '</div>'
    + '</div>';
}

function pickerHtml() {
  return '<div class="round-head"><span class="event-badge">In Silico Drug Discovery Special Session</span><h1>질문할 프로그램을 선택하세요</h1></div>'
    + sessions().map(function (s, i) {
      const qs = s.questions || [];
      const sel = qs.filter(function (q) { return q.selected; }).length;
      const stateTxt = s.status === 'open' ? '' : (sel ? ' · 마감 · 우수 질문 발표' : ' · 마감');
      const p = splitTitle(s.title);
      const info = sessionInfo(i);
      return '<div class="qcard sess-pick lineup" data-sid="' + s.id + '">'
        + '<span class="num-tile ' + tileClass(i) + '">' + (i + 1) + '</span>'
        + '<div class="lineup-body">'
        + '<div class="q-content">' + esc(p.title) + '</div>'
        + (p.speaker ? '<div class="speaker">' + esc(p.speaker) + (info.org ? '<span class="org">' + esc(info.org) + '</span>' : '') + '</div>' : '')
        + '<div class="time">' + (info.time ? '🕐 ' + esc(info.time) + ' · ' : '') + '질문 ' + qs.length + '개' + stateTxt + '</div>'
        + '</div></div>';
    }).join('');
}

function listBody(s) {
  const qs = s.questions || [];
  if (s.status === 'open') {
    if (!qs.length) return '<div class="card center muted">아직 등록된 질문이 없습니다.<br>첫 질문을 남겨보세요!</div>';
    return '<div class="list-head">등록된 질문 <b>' + qs.length + '</b>개</div>'
      + qs.slice().reverse().map(function (q) { return qCard(q, s.id); }).join('');
  }
  const winners = qs.filter(function (q) { return q.selected; });
  if (!winners.length) {
    return '<div class="card center"><div class="big-emoji">🤔</div><h2>우수 질문을 선정하고 있습니다</h2><p class="muted">잠시만 기다려 주세요.</p></div>';
  }
  const rest = qs.filter(function (q) { return !q.selected; });
  return '<h2 class="section-title">🏆 우수 질문</h2>'
    + winners.map(function (q) { return qCard(q, s.id); }).join('')
    + (rest.length
      ? '<details class="rest"><summary>전체 질문 ' + qs.length + '개 보기</summary>'
        + rest.slice().reverse().map(function (q) { return qCard(q, s.id); }).join('') + '</details>'
      : '');
}

function sessionHtml(s) {
  const p = splitTitle(s.title);
  const idx = sessions().indexOf(s);
  const info = sessionInfo(idx);
  let h = '<a href="#" id="backSel" class="muted small back-link">‹ 다른 프로그램 선택</a>'
    + '<div class="round-head"><h1>' + esc(p.title) + '</h1>'
    + (p.speaker ? '<div class="speaker">' + esc(p.speaker) + (info.org ? '<span class="org">' + esc(info.org) + '</span>' : '') + '</div>' : '')
    + (info.time ? '<div class="time">🕐 ' + esc(info.time) + '</div>' : '')
    + '</div>';
  if (s.status === 'open') {
    h += '<div class="card">'
      + '<label>이름 <span class="muted">(선택)</span></label>'
      + '<input id="author" maxlength="40" autocomplete="name" placeholder="익명" value="' + esc(localStorage.getItem(nameKey) || '') + '">'
      + '<label>전화번호 뒤 4자리</label>'
      + '<input id="phone4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" placeholder="0000" value="' + esc(localStorage.getItem(phoneKey) || '') + '">'
      + '<label>질문</label>'
      + '<textarea id="content" maxlength="500" rows="3" placeholder="질문을 입력하세요"></textarea>'
      + '<button class="btn btn-primary btn-block" id="submitBtn">질문 등록</button>'
      + '</div>';
  }
  h += '<div id="qlist">' + listBody(s) + '</div>';
  return h;
}

function render() {
  if (!sessions().length) {
    if (viewKey !== 'wait') {
      viewKey = 'wait';
      app.innerHTML = '<div class="card center"><div class="big-emoji">⏳</div><h2>아직 시작 전입니다</h2><p class="muted">잠시 후 다시 접속해 주세요.</p></div>';
    }
    return;
  }
  const cur = currentSession();
  if (!cur) {
    const key = 'pick:' + sessions().map(function (s) { return s.id + s.status + (s.questions || []).length; }).join(',');
    if (key !== viewKey) { viewKey = key; app.innerHTML = pickerHtml(); }
    return;
  }
  const key = 'sess:' + cur.id + ':' + cur.status;
  if (key !== viewKey) {
    viewKey = key;
    app.innerHTML = sessionHtml(cur);
    if (cur.status === 'open') document.getElementById('submitBtn').addEventListener('click', submit);
    document.getElementById('backSel').addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem(selKey);
      viewKey = ''; render();
    });
  } else {
    const el = document.getElementById('qlist');
    const body = listBody(cur);
    if (el && el.innerHTML !== body) el.innerHTML = body;
  }
}

app.addEventListener('click', function (e) {
  const card = e.target.closest('.sess-pick');
  if (!card) return;
  localStorage.setItem(selKey, card.dataset.sid);
  viewKey = ''; render();
});

async function submit() {
  const cur = currentSession();
  if (!cur) return;
  const author = document.getElementById('author').value.trim();
  const phone4 = document.getElementById('phone4').value.trim();
  const content = document.getElementById('content').value.trim();
  if (!/^[0-9]{4}$/.test(phone4)) { toast('전화번호 뒤 4자리를 정확히 입력해 주세요.', true); return; }
  if (!content) { toast('질문 내용을 입력해 주세요.', true); return; }
  localStorage.setItem(nameKey, author);
  localStorage.setItem(phoneKey, phone4);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '등록 중…';
  try {
    const q = await store.submitQuestion(cur.id, author || '익명', content, phone4);
    if (q && q.id != null) addMine(cur.id, q.id);
    document.getElementById('content').value = '';
    toast('질문이 등록되었습니다 ✅');
    await refresh();
  } catch (e2) {
    toast(e2.message || '등록에 실패했습니다.', true);
  }
  btn.disabled = false; btn.textContent = '질문 등록';
}

async function refresh() { state = await store.getState(); render(); }
startPolling(refresh);
</script>
</body>
</html>
